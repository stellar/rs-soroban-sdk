[workspace]
resolver = "2"

members = [
    "soroban-sdk",
    "soroban-sdk-macros",
    "soroban-meta",
    "soroban-spec",
    "soroban-spec-rust",
    "soroban-ledger-snapshot",
    "soroban-token-sdk",
    "soroban-token-spec",
    "stellar-asset-spec",
    "tests/*",
]

[workspace.package]
version = "27.0.0"
rust-version = "1.91.0"

[workspace.dependencies]
soroban-sdk = { version = "27.0.0", path = "soroban-sdk" }
soroban-sdk-macros = { version = "27.0.0", path = "soroban-sdk-macros" }
soroban-meta = { version = "27.0.0", path = "soroban-meta" }
soroban-spec = { version = "27.0.0", path = "soroban-spec" }
soroban-spec-rust = { version = "27.0.0", path = "soroban-spec-rust" }
soroban-ledger-snapshot = { version = "27.0.0", path = "soroban-ledger-snapshot" }
soroban-token-sdk = { version = "27.0.0", path = "soroban-token-sdk" }
soroban-token-spec = { version = "27.0.0", path = "soroban-token-spec" }
stellar-asset-spec = { version = "27.0.0", path = "stellar-asset-spec" }

# Protocol 28 (CAP-0085, externally managed contract executables) pins the three
# env crates to stellar/rs-soroban-env main, which carries the merged CAP-85
# host implementation (#1703) plus its follow-up test (#1711). The CAP-85 host
# functions are gated on `min_supported_protocol: 28`, so the `next` feature is
# still required at each consuming crate to make them visible.
# Productionize -> a released 28.x version on crates.io once one is cut;
# restore `version =` only and drop the git/rev lines.
[workspace.dependencies.soroban-env-common]
version = "=28.0.0"
git = "https://github.com/stellar/rs-soroban-env"
rev = "358d8bafde7332ad176165b8f9da0bd979e33cd9"

[workspace.dependencies.soroban-env-guest]
version = "=28.0.0"
git = "https://github.com/stellar/rs-soroban-env"
rev = "358d8bafde7332ad176165b8f9da0bd979e33cd9"

[workspace.dependencies.soroban-env-host]
version = "=28.0.0"
git = "https://github.com/stellar/rs-soroban-env"
rev = "358d8bafde7332ad176165b8f9da0bd979e33cd9"

[workspace.dependencies.stellar-strkey]
version = "=0.0.16"

# Protocol 28 (CAP-0085) pins stellar-xdr to stellar/rs-stellar-xdr at exactly
# the rev the env crates above pin, so the git source is unified across the
# graph and no [patch] redirect is needed. The CAP-85 XDR types are gated behind
# the `cap_0085_executable_ref` feature, which is enabled by the consuming
# crates (soroban-meta, soroban-sdk-macros) and by rs-soroban-env's own pin.
[workspace.dependencies.stellar-xdr]
version = "=27.0.0"
git = "https://github.com/stellar/rs-stellar-xdr"
rev = "a90de0c0d6eba8be668e9074cfb7b285ac0ecd34"
default-features = false

#[patch.crates-io]
#soroban-env-common = { path = "../rs-soroban-env/soroban-env-common" }
#soroban-env-guest = { path = "../rs-soroban-env/soroban-env-guest" }
#soroban-env-host = { path = "../rs-soroban-env/soroban-env-host" }
#[patch."https://github.com/stellar/rs-stellar-xdr"]
#stellar-xdr = { path = "../rs-stellar-xdr/" }

[profile.dev]
overflow-checks = true
panic = "abort"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

# The release-without-lto profile is useful for testing build cases when lto
# are disabled, such as those like the test_zero test vector. See the test_zero
# README for more details.
[profile.release-without-lto]
inherits = "release"
lto = "off"
