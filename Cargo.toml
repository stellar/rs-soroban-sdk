[workspace]
resolver = "2"

members = [
    "soroban-sdk",
    "soroban-sdk-macros",
    "soroban-meta",
    "soroban-spec",
    "soroban-spec-rust",
    "soroban-ledger-snapshot",
    "soroban-token-sdk",
    "soroban-token-spec",
    "stellar-asset-spec",
    "tests/*",
]

[workspace.package]
version = "28.0.0"
rust-version = "1.91.0"

[workspace.dependencies]
soroban-sdk = { version = "28.0.0", path = "soroban-sdk" }
soroban-sdk-macros = { version = "28.0.0", path = "soroban-sdk-macros" }
soroban-meta = { version = "28.0.0", path = "soroban-meta" }
soroban-spec = { version = "28.0.0", path = "soroban-spec" }
soroban-spec-rust = { version = "28.0.0", path = "soroban-spec-rust" }
soroban-ledger-snapshot = { version = "28.0.0", path = "soroban-ledger-snapshot" }
soroban-token-sdk = { version = "28.0.0", path = "soroban-token-sdk" }
soroban-token-spec = { version = "28.0.0", path = "soroban-token-spec" }
stellar-asset-spec = { version = "28.0.0", path = "stellar-asset-spec" }

# SPIKE: Protocol 30 (CAP-0087). Pins the env crates to the head of
# rs-soroban-env#1735; the rev self-reports 29.0.0, so the exact `=` pin is
# dropped. Productionize to released versions once #1735 lands.
[workspace.dependencies.soroban-env-common]
version = "29.0.0"
git = "https://github.com/stellar/rs-soroban-env"
rev = "d3e8ed2333e902477b5c05fcd2644fd3e9d7b752"

[workspace.dependencies.soroban-env-guest]
version = "29.0.0"
git = "https://github.com/stellar/rs-soroban-env"
rev = "d3e8ed2333e902477b5c05fcd2644fd3e9d7b752"

[workspace.dependencies.soroban-env-host]
version = "29.0.0"
git = "https://github.com/stellar/rs-soroban-env"
rev = "d3e8ed2333e902477b5c05fcd2644fd3e9d7b752"

[workspace.dependencies.stellar-strkey]
version = "=0.0.16"

# SPIKE: Protocol 30 (CAP-0087). Same git source + rev the pinned env crates
# use for stellar-xdr (rs-stellar-xdr#583); they must match exactly or cargo
# builds two copies of the crate.
[workspace.dependencies.stellar-xdr]
version = "28.0.0"
git = "https://github.com/stellar/rs-stellar-xdr"
rev = "f1b0285df1a0cac98aee0ba627c03f307c622cf2"
default-features = false

#[patch.crates-io]
#soroban-env-common = { path = "../rs-soroban-env/soroban-env-common" }
#soroban-env-guest = { path = "../rs-soroban-env/soroban-env-guest" }
#soroban-env-host = { path = "../rs-soroban-env/soroban-env-host" }
#[patch."https://github.com/stellar/rs-stellar-xdr"]
#stellar-xdr = { path = "../rs-stellar-xdr/" }

[profile.dev]
overflow-checks = true
panic = "abort"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

# The release-without-lto profile is useful for testing build cases when lto
# are disabled, such as those like the test_zero test vector. See the test_zero
# README for more details.
[profile.release-without-lto]
inherits = "release"
lto = "off"
