[workspace]
resolver = "2"

members = [
    "soroban-sdk",
    "soroban-sdk-macros",
    "soroban-meta",
    "soroban-spec",
    "soroban-spec-rust",
    "soroban-ledger-snapshot",
    "soroban-token-sdk",
    "soroban-token-spec",
    "stellar-asset-spec",
    "tests/*",
]

[workspace.package]
version = "28.0.0-rc.1"
rust-version = "1.91.0"

[workspace.dependencies]
soroban-sdk = { version = "28.0.0-rc.1", path = "soroban-sdk" }
soroban-sdk-macros = { version = "28.0.0-rc.1", path = "soroban-sdk-macros" }
soroban-meta = { version = "28.0.0-rc.1", path = "soroban-meta" }
soroban-spec = { version = "28.0.0-rc.1", path = "soroban-spec", default-features = false }
soroban-spec-rust = { version = "28.0.0-rc.1", path = "soroban-spec-rust" }
soroban-ledger-snapshot = { version = "28.0.0-rc.1", path = "soroban-ledger-snapshot" }
soroban-token-sdk = { version = "28.0.0-rc.1", path = "soroban-token-sdk" }
soroban-token-spec = { version = "28.0.0-rc.1", path = "soroban-token-spec" }
stellar-asset-spec = { version = "28.0.0-rc.1", path = "stellar-asset-spec" }

# Pinned to a rev of rs-soroban-env that adapts the host to the XDR constants
# that rs-stellar-xdr changed from u64 to u32.
# Only the 29.x line carries that adaptation, so the test ledger's default
# protocol is 29 until it is released.
[workspace.dependencies.soroban-env-common]
version = "=29.0.0"
git = "https://github.com/stellar/rs-soroban-env"
rev = "6af048cb88bfebec767d9345828ae5aeb98dd8b6"

[workspace.dependencies.soroban-env-guest]
version = "=29.0.0"
git = "https://github.com/stellar/rs-soroban-env"
rev = "6af048cb88bfebec767d9345828ae5aeb98dd8b6"

[workspace.dependencies.soroban-env-host]
version = "=29.0.0"
git = "https://github.com/stellar/rs-soroban-env"
rev = "6af048cb88bfebec767d9345828ae5aeb98dd8b6"

[workspace.dependencies.stellar-strkey]
version = "=0.0.16"

# Pinned to a rev of rs-stellar-xdr main, pending a release containing the
# `const` module of const-only types and their const XDR serializers that the
# contract spec generation in soroban-sdk-macros builds on, and which carries
# the widened contract spec type name limit that fully qualified type names
# need.
[workspace.dependencies.stellar-xdr]
version = "=28.0.0"
git = "https://github.com/stellar/rs-stellar-xdr"
rev = "e0d289adf4ad2483a10bcc8df743126974d77301"
default-features = false

#[patch.crates-io]
#soroban-env-common = { path = "../rs-soroban-env/soroban-env-common" }
#soroban-env-guest = { path = "../rs-soroban-env/soroban-env-guest" }
#soroban-env-host = { path = "../rs-soroban-env/soroban-env-host" }
#[patch."https://github.com/stellar/rs-stellar-xdr"]
#stellar-xdr = { path = "../rs-stellar-xdr/" }

[profile.dev]
overflow-checks = true
panic = "abort"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

# The release-without-lto profile is useful for testing build cases when lto
# are disabled, such as those like the test_zero test vector. See the test_zero
# README for more details.
[profile.release-without-lto]
inherits = "release"
lto = "off"
