name: Test with OpenZeppelin Contracts

on:
  push:
    branches: [main, release/**]
  pull_request:
  schedule:
  # Daily, to catch breakages caused by upcoming rust versions (beta, nightly).
  - cron: '0 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_protected == 'true' && github.sha || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# No permissions. This workflow downloads code from outside this repository and
# compiles it. No permissions ensures that any exploit in an external
# repository does not gain access to anything in this repo.
permissions: {}

jobs:
  collect-crates:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        repository: OpenZeppelin/stellar-contracts
        ref: main
    - name: Find workspace member Cargo.toml files.
      id: dirs
      run: |
        dirs=$(cargo metadata --no-deps --format-version 1 | jq -r --arg pwd "$(pwd)" '.workspace_members[] as $id | .packages[] | select(.id == $id) | .manifest_path | sub("^\($pwd)/"; "") | sub("/Cargo.toml$"; "")' | jq -Rnc '[inputs | "\(.)"]')
        echo "dirs=$dirs" | tee -a $GITHUB_OUTPUT
    outputs:
      dirs: ${{ steps.dirs.outputs.dirs }}

  test-crate:
    needs: collect-crates
    strategy:
      fail-fast: false
      matrix:
        working-directory: ${{ fromJSON(needs.collect-crates.outputs.dirs) }}
        rust: ${{ (github.event_name == 'schedule') && fromJSON('["latest", "beta", "nightly"]') || fromJSON('["latest"]') }}
    defaults:
      run:
        working-directory: stellar-contracts/${{ matrix.working-directory }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout rs-soroban-sdk
      uses: actions/checkout@v7
      with:
        path: rs-soroban-sdk

    - name: Checkout OpenZeppelin stellar-contracts
      uses: actions/checkout@v7
      with:
        repository: OpenZeppelin/stellar-contracts
        ref: main
        path: stellar-contracts

    - name: Install Rust
      run: |
        rustup update
        rustup target add wasm32v1-none

    - name: Install and use beta or nightly rust version
      if: matrix.rust != 'latest'
      run: |
        rustup install ${{ matrix.rust }}
        rustup target add --toolchain ${{ matrix.rust }} wasm32v1-none
        echo RUSTUP_TOOLCHAIN='${{ matrix.rust }}' >> $GITHUB_ENV

    - uses: stellar/actions/rust-cache@main

    - name: Check if should be built as a contract
      id: check-if-contract
      run: |
        is_a_contract=$(cargo metadata --no-deps --format-version 1 | jq -r --arg pwd "$(pwd)" '.packages[] | select(.manifest_path == "\($pwd)/Cargo.toml") | (any(.dependencies[]; .name == "soroban-sdk") and any(.targets[]; any(.crate_types[]; . == "cdylib")))')
        echo "is-a-contract=$is_a_contract" | tee -a $GITHUB_OUTPUT

    - name: Set the stellar-cli major version the local soroban-sdk requires
      working-directory: ${{ github.workspace }}
      run: echo "STELLAR_CLI_VERSION=$(make --no-print-directory -C rs-soroban-sdk version-major).0.0" >> $GITHUB_ENV

    - name: Make a copy of the local checkout for each destination soroban-sdk version
      working-directory: ${{ github.workspace }}
      run: |
        # The destination can resolve more than one soroban-sdk version: the version
        # its workspace uses, and older ones pulled in by members pinned to an old
        # release on purpose (along with crates.io crates built for that release).
        # Cargo only applies a [patch] when the patched version satisfies the
        # requirement, so for each soroban-sdk version in the destination's lock make
        # a copy of the local checkout relabelled with that version. Patching each
        # version onto its copy moves every soroban-sdk edge onto the local checkout's
        # code, whatever version it asked for.
        local_version=$(
          cargo metadata --manifest-path rs-soroban-sdk/Cargo.toml --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "soroban-sdk") | .version'
        )
        escaped=$(printf '%s' "$local_version" | sed 's/[.]/\\./g')
        cargo metadata --manifest-path stellar-contracts/Cargo.toml --format-version 1 --locked \
          | jq -r '.packages[] | select(.name == "soroban-sdk") | .version' \
          | sort -u > "$RUNNER_TEMP/sdk-versions"
        while read -r version; do
          cp -r rs-soroban-sdk "rs-soroban-sdk-$version"
          sed -i "s|\"$escaped\"|\"$version\"|g" "rs-soroban-sdk-$version/Cargo.toml"
          # soroban-sdk no longer has this feature, but stellar-contracts v0.7.x
          # manifests and the crates published from them enable it, and cargo refuses
          # to resolve a dependency on a feature that does not exist. Define it as a
          # no-op.
          grep -q '^experimental_spec_shaking_v2 =' "rs-soroban-sdk-$version/soroban-sdk/Cargo.toml" \
            || sed -i '/^\[features\]$/a experimental_spec_shaking_v2 = []' "rs-soroban-sdk-$version/soroban-sdk/Cargo.toml"
          echo "Copied local rs-soroban-sdk crates relabelled from $local_version to $version"
        done < "$RUNNER_TEMP/sdk-versions"

    - name: Patch soroban-sdk crates to the local copies
      working-directory: stellar-contracts
      run: |
        # Point each publishable rs-soroban-sdk crate, at each destination soroban-sdk
        # version, at the matching local copy with a [patch.crates-io] entry. Every
        # edge, direct or transitive (such as soroban-poseidon's), resolves through
        # the patch, so only local code gets linked and there is no duplicate
        # `panic_impl` lang item (E0152, #1723). Each copy carries exactly the version
        # the lock resolves, so the lock moves onto it without `cargo update`.
        crates=$(
          (cd ../rs-soroban-sdk && cargo metadata --format-version 1 --no-deps) \
            | jq -r --arg root "$(realpath ../rs-soroban-sdk)" \
                '.packages[] | select(.publish != []) | "\(.name)\t\(.manifest_path | sub("^\($root)/"; "") | sub("/Cargo.toml$"; ""))"'
        )
        # Don't emit a second [patch.crates-io] header if one already exists upstream.
        grep -q '^\[patch\.crates-io\]' Cargo.toml || printf '\n[patch.crates-io]\n' >> Cargo.toml
        while read -r version; do
          while IFS=$'\t' read -r crate dir; do
            echo "$crate-${version//./_} = { package = \"$crate\", path = \"../rs-soroban-sdk-$version/$dir\" }" >> Cargo.toml
          done <<< "$crates"
        done < "$RUNNER_TEMP/sdk-versions"
        # Fail here if any soroban-sdk still comes from crates.io, rather than later
        # with a duplicate lang item that doesn't say why.
        registry=$(
          cargo metadata --format-version 1 \
            | jq -r '.packages[] | select(.name == "soroban-sdk" and .source != null) | .version'
        )
        if [ -n "$registry" ]; then
          echo "::error::soroban-sdk $registry still resolves from crates.io"
          exit 1
        fi

    - name: Diff
      run: (! git diff --exit-code) || (echo 'A diff is expected'; exit 1)

    - name: Build contract
      if: steps.check-if-contract.outputs.is-a-contract == 'true'
      env:
        CARGO_BUILD_RUSTFLAGS: "-A deprecated"
      run: cargo build --target wasm32v1-none --release

    - name: Set artifact name
      if: steps.check-if-contract.outputs.is-a-contract == 'true'
      id: artifact-name
      run: echo "name=wasm-${{ matrix.rust }}-$(echo ${{ matrix.working-directory }} | sed 's/\//-/g')" | tee -a $GITHUB_OUTPUT

    - name: Upload WASM artifacts
      if: steps.check-if-contract.outputs.is-a-contract == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.artifact-name.outputs.name }}
        path: 'stellar-contracts/target/wasm32v1-none/release/*.wasm'
        retention-days: 3

    - env:
        CARGO_BUILD_RUSTFLAGS: "-A deprecated"
      run: cargo test

    - name: Diff
      run: git add -N . && git diff HEAD
