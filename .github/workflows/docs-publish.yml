name: Docs Publish

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_protected && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/configure-pages@v6
    - name: Set the commit the docs are built from in the banner
      env:
        COMMIT: ${{ github.sha }}
      run: |
        sed -i \
          -e "s|{{COMMIT}}|$COMMIT|g" \
          -e "s|{{COMMIT_SHORT}}|${COMMIT:0:7}|g" \
          .github/docs-banner.html
    - uses: stellar/actions/rust-cache@main
    - run: rustup install nightly
    - name: Build docs for all library crates
      env:
        # The path to the banner must be absolute because cargo runs rustdoc
        # with the working directory set to each package's directory.
        RUSTDOCFLAGS: >-
          -Zunstable-options
          --enable-index-page
          --html-before-content ${{ github.workspace }}/.github/docs-banner.html
      run: make doc-only CARGO_DOC_ARGS=
    - name: Add the banner to the index page
      # The index page generated by --enable-index-page does not get the
      # --html-before-content banner, so add it to that page after the build.
      run: |
        python3 - <<'PY'
        import re
        banner = open(".github/docs-banner.html").read()
        path = "target/doc/index.html"
        html = open(path).read()
        html, n = re.subn(r"<body[^>]*>", lambda m: m.group(0) + banner, html, count=1)
        assert n == 1, "no body tag found in " + path
        open(path, "w").write(html)
        PY
    - uses: actions/upload-pages-artifact@v5
      with:
        path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
    - id: deploy
      uses: actions/deploy-pages@v4
