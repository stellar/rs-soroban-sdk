name: Semver Impact (forks)

# The Semver Impact workflow classifies pull requests automatically, but it does
# not activate for pull requests from forks: the activation check requires write
# access to this repository, which a contributor from a fork does not have. This
# workflow fails on those pull requests so that the classification is done by a
# reviewer by hand instead of being silently skipped.

on:
  pull_request:
    # labeled and unlabeled are included so the check re-runs, and passes, as
    # soon as a reviewer applies the label it is asking for.
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:

  semver-label:
    # The fork test matches the one the Semver Impact workflow activates on, so
    # that exactly the pull requests it skips are the ones asked for a label.
    if: >-
      github.event.pull_request.head.repo.id != github.repository_id
      && !contains(github.event.pull_request.labels.*.name, 'semver:major')
      && !contains(github.event.pull_request.labels.*.name, 'semver:minor')
      && !contains(github.event.pull_request.labels.*.name, 'semver:patch')
    runs-on: ubuntu-latest
    steps:
    - name: Require a semver label, since forks are not classified automatically
      run: |
        echo "::error title=Apply a semver label::This pull request is from a fork, so the Semver Impact workflow did not classify it. A reviewer must assess the change and apply one of semver:major, semver:minor, or semver:patch."
        cat <<'EOF'

        This pull request is from a fork, so the Semver Impact workflow did not
        classify it and no semver label was applied automatically.

        A reviewer needs to assess what the change does to the public API of the
        published crates and apply exactly one of these labels:

          semver:major   breaking change to the public API
          semver:minor   additive change to the public API
          semver:patch   no change to the public API

        The rules to classify against are in .github/semver-rules.md. The
        cargo-semver-checks job in the Rust workflow still runs on forks and
        catches removals and changes to existing items, but it does not report
        added API, behaviour changes, or changes to what the macros generate, so
        those have to be judged from the diff.

        This check passes once one of the labels above is on the pull request.
        EOF
        exit 1
