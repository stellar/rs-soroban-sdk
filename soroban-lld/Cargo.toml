[package]
name = "soroban-lld"
description = "Linker shim that shakes unused entries out of a Soroban contract's spec at link time."
homepage = "https://github.com/stellar/rs-soroban-sdk"
repository = "https://github.com/stellar/rs-soroban-sdk"
authors = ["Stellar Development Foundation <info@stellar.org>"]
readme = "README.md"
license = "Apache-2.0"
version.workspace = true
edition = "2021"
rust-version.workspace = true

[[bin]]
name = "soroban-lld"
path = "src/main.rs"

[dependencies]
soroban-spec = { workspace = true }
stellar-xdr = { workspace = true, features = ["std"] }
thiserror = "1.0.32"
wasmparser = "0.116.1"

[dev-dependencies]
wasmparser = "0.116.1"
