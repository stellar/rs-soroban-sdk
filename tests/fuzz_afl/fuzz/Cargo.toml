[package]
name = "test_fuzz_afl-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[dependencies]
afl = "0.18"
arbitrary = { version = "~1.3.0", features = ["derive"] }
soroban-sdk = { path = "../../../soroban-sdk", features = [ "testutils" ]}
test_fuzz_afl = { path = ".." }

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

# This is its own workspace root, so it does not inherit the repo root's patch
# and needs its own copy. Remove both together.
[patch.crates-io]
# Pending https://github.com/stellar/rs-stellar-xdr/pull/566, which widens the
# contract spec type name limit so that fully qualified type names fit, on top
# of the `const` module of const-only types and their const XDR serializers
# that the contract spec generation in soroban-sdk-macros builds on.
stellar-xdr = { git = "https://github.com/stellar/rs-stellar-xdr", rev = "d5c3f39bf7bc52a6bbc4db0518c892ec22b2dd11" }
# Pending https://github.com/stellar/rs-soroban-env/pull/1733, which adapts the
# host to the XDR constants that rs-stellar-xdr#580 changes from u64 to u32.
# Only the 29.x line carries that adaptation, so the test ledger's default
# protocol is 29 until it is released.
soroban-env-common = { git = "https://github.com/stellar/rs-soroban-env", rev = "de68ee914401e70d3d8350a4d004c0442943324e" }
soroban-env-guest = { git = "https://github.com/stellar/rs-soroban-env", rev = "de68ee914401e70d3d8350a4d004c0442943324e" }
soroban-env-host = { git = "https://github.com/stellar/rs-soroban-env", rev = "de68ee914401e70d3d8350a4d004c0442943324e" }

[profile.release]
debug = 1

[[bin]]
name = "fuzz_target_1"
path = "src/fuzz_target_1.rs"
test = false
doc = false
