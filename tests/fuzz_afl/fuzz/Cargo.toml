[package]
name = "test_fuzz_afl-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[dependencies]
afl = "0.18"
arbitrary = { version = "~1.3.0", features = ["derive"] }
soroban-sdk = { path = "../../../soroban-sdk", features = [ "testutils" ]}
test_fuzz_afl = { path = ".." }

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

# This is its own workspace root, so it does not inherit the repo root's patch
# and needs its own copy. Remove both together.
[patch.crates-io]
# Pending https://github.com/stellar/rs-stellar-xdr/pull/562, which adds the
# borrowing `*View` types and their const XDR serializers that the contract spec
# generation in soroban-sdk-macros builds on.
stellar-xdr = { git = "https://github.com/stellar/rs-stellar-xdr", rev = "e73df1f6793fe5916dce7a833e14c0718786ab04" }

[profile.release]
debug = 1

[[bin]]
name = "fuzz_target_1"
path = "src/fuzz_target_1.rs"
test = false
doc = false
