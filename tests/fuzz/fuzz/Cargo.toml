[package]
name = "test_fuzz-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
soroban-sdk = { path = "../../../soroban-sdk", features = [ "testutils" ]}
test_fuzz = { path = ".." }

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

# This crate is its own workspace, so it needs the same patch the root
# workspace carries while the const XDR serializers are pending release.
[patch.crates-io]
stellar-xdr = { git = "https://github.com/stellar/rs-stellar-xdr", rev = "2e565108988d9181c26477815e708ade929e67e0" }

[profile.release]
debug = 1

[[bin]]
name = "fuzz_target_1"
path = "fuzz_targets/fuzz_target_1.rs"
test = false
doc = false
